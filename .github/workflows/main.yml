name: Build and Package GMPlayer

on:
  push:
    branches:
      - main  # 当 main 分支有 push 时触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: 📥 安装 pnpm
        run: npm install -g pnpm

      - name: 📦 安装依赖
        run: pnpm install

      - name: 🏗️ 构建项目
        run: pnpm build

      - name: 📦 打包 dist 目录
        run: |
          tar -czvf gmplayer-dist.tar.gz -C dist .

      - name: 📤 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: gmplayer-dist
          path: gmplayer-dist.tar.gz
          retention-days: 7  # 保留 7 天
