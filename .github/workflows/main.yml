name: Build and Package GMPlayer

on:
  workflow_dispatch:  # 仅手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js 和 pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: 📥 安装 pnpm
        run: |
          corepack enable  # 启用 corepack（pnpm 需要）
          npm install -g pnpm
          echo "$(pnpm root -g)/bin" >> $GITHUB_PATH  # 确保 pnpm 在 PATH 中
          pnpm --version  # 确认安装成功

      - name: 📦 安装依赖
        run: pnpm install

      - name: 🏗️ 构建项目
        run: pnpm build

      - name: 📦 打包 dist 目录
        run: |
          tar -czvf gmplayer-dist.tar.gz -C dist .

      - name: 📤 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: gmplayer-dist
          path: gmplayer-dist.tar.gz
          retention-days: 7  # 构建产物保留 7 天
